name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-vector.txt
      - run: python scripts/generate_demo_data.py --seed 42
      - run: python scripts/verify_setup.py
      - run: ruff check backend tests
      - run: pytest tests/ -q --tb=short
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci && npm run type-check && npm run lint && npm run build
