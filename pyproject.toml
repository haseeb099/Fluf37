[project]
name = "nexus-ai"
version = "0.9.0"
requires-python = ">=3.11"
description = "Auditable multi-agent financial intelligence platform"
readme = "README.md"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
